<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Auge 위키</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- ===================== 로그인 화면 ===================== -->
  <div id="login-screen" class="screen active">
    <div class="login-box">
      <div class="login-title">Auge 위키</div>
      <div class="login-subtitle">지식그래프를 조회 전용으로 열람합니다</div>
      <button id="login-btn" class="btn-primary">구글로 로그인</button>
      <div id="login-error" class="error-text"></div>
    </div>
  </div>

  <!-- ===================== 프로젝트 선택 화면 ===================== -->
  <div id="project-screen" class="screen">
    <header class="top-bar">
      <div class="top-bar-title">프로젝트 선택</div>
      <button id="theme-toggle-1" class="icon-btn" title="테마 전환">◐</button>
    </header>
    <div id="project-list" class="project-list">
      <div class="loading-text">불러오는 중…</div>
    </div>
  </div>

  <!-- ===================== 뷰어 화면 (검색 + 결과 + 상세) ===================== -->
  <div id="viewer-screen" class="screen">
    <header class="top-bar">
      <button id="back-to-projects" class="icon-btn" title="프로젝트 목록으로">←</button>
      <div class="top-bar-title" id="viewer-project-title">프로젝트</div>
      <button id="theme-toggle-2" class="icon-btn" title="테마 전환">◐</button>
    </header>

    <div class="search-bar-wrap">
      <input id="search-input" class="search-input" type="text" placeholder="노드명 또는 메모 내용 검색" autocomplete="off" />
    </div>

    <!-- 검색 결과 리스트 -->
    <div id="results-panel" class="panel active">
      <div id="results-list" class="results-list">
        <div class="empty-hint">검색어를 입력해보세요</div>
      </div>
    </div>

    <!-- 상세 화면 -->
    <div id="detail-panel" class="panel">
      <button id="detail-back" class="back-link">← 검색 결과로</button>
      <div class="detail-body">
        <h1 id="detail-title" class="detail-title"></h1>
        <div id="detail-type" class="detail-type"></div>
        <div id="detail-description" class="detail-description"></div>

        <div class="rel-section">
          <div class="rel-heading">상위 연결</div>
          <div id="detail-parents" class="rel-list"><div class="rel-empty">없음</div></div>
        </div>

        <div class="rel-section">
          <div class="rel-heading">하위 연결</div>
          <div id="detail-children" class="rel-list"><div class="rel-empty">없음</div></div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
